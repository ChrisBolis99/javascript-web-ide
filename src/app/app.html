<div class="ide-shell">
  <app-toolbar
    [isDark]="isDark()"
    [errorCount]="errorCount()"
    (runClicked)="runCode()"
    (clearClicked)="clearConsole()"
    (themeToggled)="toggleTheme()"
  />

  <main class="workspace">
    <app-code-editor
      #editor
      [initialCode]="starterCode"
      [isDark]="isDark()"
      (errorCountChange)="errorCount.set($event)"
    />

    <app-console-panel [entries]="logs()" />
  </main>
</div>

<router-outlet />
