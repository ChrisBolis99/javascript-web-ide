<div class="ide-shell" [class.plain-text]="plainTextMode()">
  <app-toolbar
    [isDark]="isDark()"
    [plainTextMode]="plainTextMode()"
    [errorCount]="errorCount()"
    (runClicked)="runCode()"
    (clearClicked)="clearConsole()"
    (themeToggled)="toggleTheme()"
    (plainTextToggled)="togglePlainText()"
  />

  <main class="workspace">
    <app-code-editor
      #editor
      [initialCode]="starterCode"
      [isDark]="isDark()"
      [plainTextMode]="plainTextMode()"
      (errorCountChange)="errorCount.set($event)"
    />

    <div class="preview-panel">
      <div class="preview-header">Output</div>
      <div id="sandbox-output"></div>
    </div>

    <app-console-panel
      [entries]="logs()"
      [plainTextMode]="plainTextMode()"
    />
  </main>
</div>

<router-outlet />
