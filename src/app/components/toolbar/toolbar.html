<header class="toolbar">
  <button type="button" (click)="runClicked.emit()">Run</button>
  <button type="button" (click)="clearClicked.emit()">Clear</button>
  <button type="button" (click)="themeToggled.emit()">
    Theme: {{ isDark() ? 'Dark' : 'Light' }}
  </button>
  <span class="status">
    Errors: {{ errorCount() }}
  </span>
</header>
